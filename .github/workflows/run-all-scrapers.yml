name: "🚀 Trigger All Scrapers"

on:
  workflow_dispatch: # Allows you to fire all 15 scrapers instantly with one click
  schedule:
    - cron: "27 16-23,0-3 * * *" # Consolidates your scheduling into a single reliable trigger

jobs:
  trigger-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scrapers Simultaneously
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            const workflows = [
              "calcareers_watch.yml",
              "csucareers_watch.yml",
              "evals.yml",
              "glassdoor_watch.yml",
              "google_jobs_watch.yml",
              "hiringcafe_watch.yml",
              "indeed_watch.yml",
              "linkedin_backfill.yml",
              "linkedin_watch.yml",
              "linkedin_watch_backup.yml",
              "localgov_watch.yml",
              "scrape_jobs.yml",
              "tests.yml",
              "usajobs_watch.yml",
              "ziprecruiter_watch.yml"
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.ref;

            console.log(`Starting parallel execution for ${workflows.length} workflows...`);

            await Promise.all(workflows.map(async (workflowId) => {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  ref,
                });
                console.log(`✅ Successfully triggered: ${workflowId}`);
              } catch (error) {
                console.error(`❌ Failed to trigger ${workflowId}:`, error.message);
              }
            }));
