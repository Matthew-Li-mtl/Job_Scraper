name: "🚀 Trigger All Scrapers"

on:
  workflow_dispatch: 
  schedule:
    - cron: "27 16-23,0-3 * * *"

jobs:
  trigger-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Scrapers Simultaneously
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SYNC_TOKEN }}
          script: |
            // Explicitly appending the absolute directory path to each workflow file
            const workflows = [
              ".github/workflows/calcareers_watch.yml",
              ".github/workflows/csucareers_watch.yml",
              ".github/workflows/evals.yml",
              ".github/workflows/glassdoor_watch.yml",
              ".github/workflows/google_jobs_watch.yml",
              ".github/workflows/hiringcafe_watch.yml",
              ".github/workflows/indeed_watch.yml",
              ".github/workflows/linkedin_backfill.yml",
              ".github/workflows/linkedin_watch.yml",
              ".github/workflows/linkedin_watch_backup.yml",
              ".github/workflows/localgov_watch.yml",
              ".github/workflows/scrape_jobs.yml",
              ".github/workflows/tests.yml",
              ".github/workflows/usajobs_watch.yml",
              ".github/workflows/ziprecruiter_watch.yml"
            ];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.ref;

            console.log(`Starting parallel execution for ${workflows.length} workflows...`);

            await Promise.all(workflows.map(async (workflowId) => {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: workflowId,
                  ref,
                });
                console.log(`✅ Successfully triggered: ${workflowId}`);
              } catch (error) {
                console.error(`❌ Failed to trigger ${workflowId}:`, error.message);
              }
            }));
